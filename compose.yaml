# Food ordering agent: testing in production demo
#   docker compose up --build
# Control panel  http://localhost:8000
# Grafana        http://localhost:3000   (anonymous viewer; admin/admin to edit)
# Prometheus     http://localhost:9090

services:
  simulator:
    build: ./simulator
    ports: ["8000:8000"]
    environment:
      SIM_DAY_SECONDS: "30"   # real seconds per simulated day (alert windows assume 30)
      SIM_SEED: "7"
      CLEAR_EVENTS_ON_START: "true"   # a restart starts over at day 0
      EVENTS_DIR: /data/events
      GRAFANA_URL: http://localhost:3000
      PROMETHEUS_URL: http://localhost:9090
    volumes:
      - ./data:/data
    restart: unless-stopped

  drift:
    build: ./drift
    environment:
      EVENTS_DIR: /data/events
      DRIFT_INTERVAL_SECONDS: "10"
      DRIFT_METHOD: psi
    volumes:
      - ./data:/data:ro
    depends_on: [simulator]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on: [simulator, drift]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/food_agent.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped
