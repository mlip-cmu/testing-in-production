global:
  # Time is compressed (one simulated day = 30 s by default), so scrape often.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: agent
    static_configs:
      - targets: ["simulator:8000"]
  - job_name: drift
    static_configs:
      - targets: ["drift:8001"]
